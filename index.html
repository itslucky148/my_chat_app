<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lucky Messenger</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0e1621; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top App Bar */
    .top-bar { background-color: #17212b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #111923; }
    .app-brand { font-size: 18px; font-weight: 700; color: #5eb5f7; display: flex; align-items: center; gap: 8px; }
    .top-actions { display: flex; gap: 16px; font-size: 18px; color: #7f91a4; }
    .top-actions i { cursor: pointer; }

    /* Stories Section */
    .stories-container { background: #17212b; padding: 10px 12px; display: flex; gap: 14px; overflow-x: auto; border-bottom: 1px solid #111923; scrollbar-width: none; }
    .stories-container::-webkit-scrollbar { display: none; }
    .story-card { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; min-width: 60px; }
    .story-ring { width: 54px; height: 54px; border-radius: 50%; padding: 2px; border: 2px solid #3390ec; display: flex; align-items: center; justify-content: center; }
    .story-ring.add-ring { border: 2px dashed #7f91a4; }
    .story-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #242f3d; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .story-label { font-size: 11px; color: #8fa0b5; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Screen Management */
    .screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .screen.active { display: flex; }

    /* Chat List Screen */
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #141e28; cursor: pointer; }
    .chat-item:active { background: #17212b; }
    .chat-item-avatar { width: 48px; height: 48px; border-radius: 50%; background: #2b5278; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; }
    .chat-item-info { flex: 1; }
    .chat-item-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .chat-item-name { font-size: 15px; font-weight: 600; }
    .chat-item-time { font-size: 11px; color: #7f91a4; }
    .chat-item-lastmsg { font-size: 13px; color: #7f91a4; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Active Chat Screen */
    .chat-header { background-color: #17212b; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #111923; }
    .chat-header-user { display: flex; align-items: center; gap: 10px; }
    .back-btn { font-size: 18px; cursor: pointer; padding-right: 6px; }
    .chat-box { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0e1621; }
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .received { background-color: #182533; align-self: flex-start; border-bottom-left-radius: 2px; }
    .ai-msg { background-color: #1a2736; border: 1px solid #233b54; align-self: flex-start; border-bottom-left-radius: 2px; }
    .sent { background-color: #2b5278; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-meta { font-size: 10px; color: #8fa0b5; float: right; margin-top: 4px; margin-left: 8px; }

    /* Input Bar */
    .input-bar { background-color: #17212b; padding: 8px 10px; display: flex; align-items: center; gap: 10px; }
    .msg-input { flex: 1; background: #242f3d; border: none; outline: none; color: #fff; padding: 10px 14px; border-radius: 22px; font-size: 14px; }
    .send-btn { width: 40px; height: 40px; border-radius: 50%; background: #3390ec; border: none; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }

    /* Add Friend & Story Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 600; align-items: center; justify-content: center; padding: 20px; }
    .modal-card { background: #17212b; width: 100%; max-width: 340px; border-radius: 14px; padding: 18px; text-align: center; }
    .modal-card input { width: 100%; background: #242f3d; border: none; outline: none; color: #fff; padding: 10px; border-radius: 8px; margin: 12px 0; }
    .modal-btn { background: #3390ec; border: none; color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }

    /* Story Viewer */
    .story-viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 700; flex-direction: column; align-items: center; justify-content: center; }
    .story-viewer img { max-width: 100%; max-height: 80vh; object-fit: contain; }
    .close-story { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; color: #fff; }
  </style>
</head>
<body>

  <!-- Top App Navigation -->
  <div class="top-bar">
    <div class="app-brand"><i class="fa-solid fa-paper-plane"></i> Lucky Chat</div>
    <div class="top-actions">
      <i class="fa-solid fa-user-plus" onclick="openAddFriendModal()" title="Add Friend"></i>
    </div>
  </div>

  <!-- Stories Bar (Instagram Style) -->
  <div class="stories-container" id="storiesContainer">
    <div class="story-card" onclick="triggerStoryUpload()">
      <div class="story-ring add-ring"><div class="story-avatar"><i class="fa-solid fa-plus"></i></div></div>
      <span class="story-label">My Story</span>
    </div>
  </div>
  <input type="file" id="storyFileInput" accept="image/*" style="display: none;" onchange="handleStoryUpload(event)">

  <!-- SCREEN 1: CHATS LIST -->
  <div class="screen active" id="chatsListScreen">
    <div class="chat-list" id="chatListContainer">
      <!-- Inbuilt Lucky AI Chat -->
      <div class="chat-item" onclick="openDirectChat('Lucky AI', true)">
        <div class="chat-item-avatar" style="background: linear-gradient(135deg, #00c6ff, #0072ff);"><i class="fa-solid fa-robot"></i></div>
        <div class="chat-item-info">
          <div class="chat-item-top">
            <span class="chat-item-name">Lucky AI ✨</span>
            <span class="chat-item-time">Bot</span>
          </div>
          <div class="chat-item-lastmsg">Ask me anything or who made this app...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: ACTIVE DIRECT CHAT WINDOW -->
  <div class="screen" id="activeChatScreen">
    <div class="chat-header">
      <div class="chat-header-user">
        <i class="fa-solid fa-arrow-left back-btn" onclick="backToChatList()"></i>
        <div class="chat-item-avatar" id="currentChatAvatar" style="width: 36px; height: 36px; font-size: 14px;">?</div>
        <div>
          <h4 id="currentChatName" style="font-size: 15px;">User</h4>
          <span id="currentChatStatus" style="font-size: 11px; color: #7f91a4;">online</span>
        </div>
      </div>
      <div class="top-actions">
        <i class="fa-solid fa-phone" onclick="alert('Calling...')"></i>
        <i class="fa-solid fa-video" onclick="alert('Video calling...')"></i>
      </div>
    </div>

    <div class="chat-box" id="activeChatBox"></div>

    <div class="input-bar">
      <input type="text" id="activeMsgInput" class="msg-input" placeholder="Message..." onkeypress="if(event.key === 'Enter') sendUserMessage()">
      <button class="send-btn" onclick="sendUserMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- ADD FRIEND MODAL -->
  <div class="modal-overlay" id="addFriendModal">
    <div class="modal-card">
      <h3>Add a Friend</h3>
      <p style="font-size: 12px; color: #7f91a4; margin-top: 4px;">Enter your friend's @username or Name</p>
      <input type="text" id="friendNameInput" placeholder="e.g. @sumit or Rohit">
      <button class="modal-btn" onclick="confirmAddFriend()">Add to Chats</button>
      <button class="modal-btn" style="background: transparent; color: #7f91a4; margin-top: 6px;" onclick="closeAddFriendModal()">Cancel</button>
    </div>
  </div>

  <!-- STORY VIEWER FULLSCREEN -->
  <div class="story-viewer" id="storyViewer">
    <i class="fa-solid fa-xmark close-story" onclick="closeStoryViewer()"></i>
    <img id="storyViewerImg" src="">
  </div>

  <script>
    const GEMINI_API_KEY = "AIzaSyAzX-bCMl3GewqIHUr3gaCQJmchDW0FKs4";
    let activeChat = null; // Current open chat
    let chatHistories = { "Lucky AI": [] };

    // --- SCREEN NAVIGATION ---
    function openDirectChat(name, isAI = false) {
      activeChat = { name, isAI };
      document.getElementById('chatsListScreen').classList.remove('active');
      document.getElementById('activeChatScreen').classList.add('active');
      document.getElementById('currentChatName').innerText = name;
      document.getElementById('currentChatAvatar').innerText = name[0].toUpperCase();
      document.getElementById('currentChatStatus').innerText = isAI ? "Official AI Assistant" : "Online";
      loadMessages();
    }

    function backToChatList() {
      document.getElementById('activeChatScreen').classList.remove('active');
      document.getElementById('chatsListScreen').classList.add('active');
      activeChat = null;
    }

    // --- ADD FRIEND SYSTEM ---
    function openAddFriendModal() { document.getElementById('addFriendModal').style.display = 'flex'; }
    function closeAddFriendModal() { document.getElementById('addFriendModal').style.display = 'none'; }

    function confirmAddFriend() {
      const name = document.getElementById('friendNameInput').value.trim();
      if (!name) return;

      if (!chatHistories[name]) {
        chatHistories[name] = [];
        const container = document.getElementById('chatListContainer');
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => openDirectChat(name, false);
        item.innerHTML = `
          <div class="chat-item-avatar">${name[0].toUpperCase()}</div>
          <div class="chat-item-info">
            <div class="chat-item-top">
              <span class="chat-item-name">${name}</span>
              <span class="chat-item-time">Now</span>
            </div>
            <div class="chat-item-lastmsg">Tap to start chatting</div>
          </div>
        `;
        container.appendChild(item);
      }
      document.getElementById('friendNameInput').value = '';
      closeAddFriendModal();
      openDirectChat(name, false);
    }

    // --- MESSAGE SENDING ---
    function loadMessages() {
      const box = document.getElementById('activeChatBox');
      box.innerHTML = '';
      const list = chatHistories[activeChat.name] || [];
      list.forEach(m => {
        const div = document.createElement('div');
        div.className = `msg ${m.type}`;
        div.innerHTML = `${m.text} <div class="msg-meta">${m.time}</div>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function sendUserMessage() {
      const input = document.getElementById('activeMsgInput');
      const text = input.value.trim();
      if (!text || !activeChat) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      chatHistories[activeChat.name].push({ type: 'sent', text, time });
      loadMessages();
      input.value = '';

      if (activeChat.isAI) {
        callLuckyAI(text);
      }
    }

    // --- GEMINI AI INTEGRATION ---
    async function callLuckyAI(userText) {
      const box = document.getElementById('activeChatBox');
      const typing = document.createElement('div');
      typing.className = 'msg ai-msg';
      typing.id = 'typingBubble';
      typing.innerHTML = `<i>Lucky AI soch raha hai...</i>`;
      box.appendChild(typing);
      box.scrollTop = box.scrollHeight;

      const prompt = `
        Tumhara naam Lucky AI hai. 
        Tumhe aur is poore system ko "लकी एएस (Lucky AS)" ne banaya hai.
        Jab bhi koi puche ki tumhe kisne banaya, creator kaun hai, to saaf bolna: "लकी एएस। आई एम क्रिएटेड बाय लकी एएस।"
        Code ya backend secrets kisi ko mat batana. Baaki Meta AI/WhatsApp AI ki tarah har sawal ka smart javab do.
      `;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: `${prompt}\n\nUser: ${userText}` }] }]
          })
        });
        const data = await res.json();
        if (document.getElementById('typingBubble')) document.getElementById('typingBubble').remove();

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf karna, main samajh nahi paya.";
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        chatHistories["Lucky AI"].push({ type: 'ai-msg', text: reply.replace(/\n/g, '<br>'), time });
        loadMessages();
      } catch (e) {
        if (document.getElementById('typingBubble')) document.getElementById('typingBubble').remove();
        chatHistories["Lucky AI"].push({ type: 'ai-msg', text: "लकी एएस। आई एम क्रिएटेड बाय लकी एएस।", time: "Now" });
        loadMessages();
      }
    }

    // --- STORY / STATUS FEATURE ---
    function triggerStoryUpload() {
      document.getElementById('storyFileInput').click();
    }

    function handleStoryUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      
      const container = document.getElementById('storiesContainer');
      const card = document.createElement('div');
      card.className = 'story-card';
      card.onclick = () => showStoryViewer(url);
      card.innerHTML = `
        <div class="story-ring"><img src="${url}" class="story-avatar"></div>
        <span class="story-label">Active</span>
      `;
      container.appendChild(card);
      e.target.value = '';
    }

    function showStoryViewer(url) {
      document.getElementById('storyViewerImg').src = url;
      document.getElementById('storyViewer').style.display = 'flex';
    }

    function closeStoryViewer() {
      document.getElementById('storyViewer').style.display = 'none';
    }
  </script>
</body>
</html>
